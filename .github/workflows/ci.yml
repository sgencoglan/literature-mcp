name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Eşleşen yerel venv 3.13; 3.10 paketlerin alt sınırı.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: validate (py${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema ruff
          pip install -e packages/sciencedirect-meta
          pip install -e packages/report-kit

      - name: Validate repository
        run: bash scripts/validate_all.sh
