[project]
name = "literature-report-kit"
version = "2.4.0"
description = "Altın standart kitap bölümü raporu üreteci: düzeltilmiş metin, değişiklik kartları ve sayfa doğrulamalı kanıt matrisi."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chapter-report = "report_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_kit"]
