[project]
name = "sciencedirect-meta-mcp"
version = "0.1.0"
description = "API-key-free literature metadata and local full-text tools via OpenAlex, PubMed, Europe PMC and Crossref."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
    "PyMuPDF>=1.24",
]

[project.scripts]
sciencedirect-meta-mcp = "sciencedirect_meta.unified:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciencedirect_meta"]
